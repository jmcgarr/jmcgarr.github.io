# Gradle's configuration cache (T114): Gradle saves the result of reading build.gradle and reuses it, so a repeat
# `./gradlew bake` or `bakePreview` starts sooner. The first run of a command, or the first after editing
# build.gradle, settings.gradle, or this file, prints "Configuration cache entry stored"; the next prints "Reusing
# configuration cache". Posts, templates, SCSS, and jbake.properties are read when tasks run, so edits to them are
# always picked up. To run once without it: --no-configuration-cache.
org.gradle.configuration-cache=true
