# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "source" ]
  pull_request:
    branches: [ "source" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GiHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    - name: Bake with Gradle
      run: ./gradlew bake --info --stacktrace

    # TEST ONLY: simulate docs/ leaking into the site
    - name: Simulate a docs leak
      run: cp -R docs build/jbake/docs

    # docs/ holds internal planning docs and must never reach the live site (see AGENTS.md)
    - name: Check docs are not published
      run: scripts/check-docs-not-published.sh build/jbake

    # THROWAWAY TEST BRANCH (T005 negative test). DO NOT MERGE.
    # Same shape as the real step (an `if:` with no status function), but true on PRs
    # and harmless: no secrets, no publish.
    - name: Publish content
      if: github.event_name == 'pull_request'
      run: echo "DRY RUN - would publish build/jbake to master"

    # TEST ONLY: what would a publish from this Linux build change on the live site?
    - name: Compare with live site
      if: always()
      run: |
        git fetch --no-tags --depth=1 origin master
        mkdir -p /tmp/live
        git archive FETCH_HEAD | tar -x -C /tmp/live
        echo "live files:  $(find /tmp/live -type f | wc -l)"
        echo "build files: $(find build/jbake -type f | wc -l)"
        diff -rq /tmp/live build/jbake > /tmp/diff.txt || true
        echo "== only on live (a publish would delete): $(grep -c '^Only in /tmp/live' /tmp/diff.txt || true)"
        grep '^Only in /tmp/live' /tmp/diff.txt | head -50 || true
        echo "== only in build (a publish would add): $(grep -c '^Only in build' /tmp/diff.txt || true)"
        grep '^Only in build' /tmp/diff.txt | head -50 || true
        echo "== changed: $(grep -c '^Files ' /tmp/diff.txt || true)"
        grep '^Files ' /tmp/diff.txt | head -100 || true
        echo "== content diffs (first 10 changed files, 40 lines each)"
        grep '^Files ' /tmp/diff.txt | head -10 | sed -E 's/^Files (.*) and (.*) differ$/\1\t\2/' |
          while IFS=$'\t' read -r a b; do echo "--- $b"; diff "$a" "$b" | head -40 || true; done
        echo "== URL check (strict on Linux)"
        scripts/check-urls.sh build/jbake
