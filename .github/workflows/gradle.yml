# Builds the site with JBake, runs the quality gates, and deploys to GitHub Pages (revival task T027).
# Pull requests run everything except the deploy. Pushes to `main` (and manual runs on `main`) deploy,
# then smoke-test the live site.
# Pages must be set to Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # "Run workflow" button: redeploy on demand (e.g. re-run an older run to roll back)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    # fetch-depth: 0 fetches the whole history, so the review step below can find a PR's merge base with main.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # :build-logic:check first: the build plugin's unit tests, its TestKit tests (the fixture site under
    # build-logic/src/test/fixtures baked with the configuration cache on) and Gradle's plugin validation, so a plugin
    # regression fails here, before the bake (docs/06-GRADLE-PLUGIN.md, T129)
    - name: Bake with Gradle
      run: ./gradlew :build-logic:check bake --info --stacktrace

    # Exactly what gets deployed: the bake output minus drafts. JBake always renders status=draft posts
    # (as <name>-draft.html) for local preview and has no setting to skip them (T009). Every check below
    # runs on this staged folder, so what's checked is what ships.
    - name: Stage the site for deployment
      run: |
        rm -rf build/site && mkdir -p build/site
        rsync -a --prune-empty-dirs --exclude '*-draft.html' build/jbake/ build/site/
        echo "Staged $(find build/site -type f | wc -l) files ($(du -sh build/site | cut -f1))"

    - name: Check drafts are not published
      run: |
        drafts="$(find build/site -name '*-draft.html')"
        if [ -n "$drafts" ]; then
          echo "FAIL: drafts in the deploy contents:"; echo "$drafts"; exit 1
        fi
        echo "OK: no drafts in the deploy contents"

    # Content, templates, and SCSS use LF line endings (T051). The WordPress import used old Mac CR-only line
    # breaks, which made git and GitHub show any edit to such a post as a change to the whole file.
    - name: Check sources have no CR line endings
      run: |
        files="$(grep -rlI $'\r' src/jbake/content src/jbake/templates src/scss || true)"
        if [ -n "$files" ]; then
          echo "FAIL: CR line endings (convert to LF):"; echo "$files"; exit 1
        fi
        echo "OK: no CR line endings in content, templates, or SCSS"

    # The preview's live-reload script (T064) is only for `./gradlew bakePreview`. Its marker must never go live.
    - name: Check live reload is not published
      run: |
        test -d build/site
        pages="$(grep -rliI livereload build/site || true)"
        if [ -n "$pages" ]; then
          echo "FAIL: the preview's live-reload script is in the deploy contents:"; echo "$pages"; exit 1
        fi
        echo "OK: no live-reload script in the deploy contents"

    # The plugin's checks of the staged site (what is deployed), not of the bake they depend on, which is up to date
    # here (docs/08-SCRIPTS-MIGRATION.md, T141; the same as `./gradlew checkSite` locally):
    #   checkUrls              every published URL (docs/baseline/urls.txt) is still a page, or an approved removal
    #                          (T006, Rule 1). Linux is case-sensitive, so this is strict here and catches what a
    #                          macOS bake can't: the 2 case-only tag stubs
    #   checkDocsNotPublished  nothing from docs/ (internal planning docs) reached the site (T004, Rule 4)
    #   checkTagRedirects      old tag URLs (with spaces, or capitalized twins) are redirect stubs to a real tag page
    #                          (T039, T055); the 2 case-only stubs (src/case-redirects/) are in a Linux bake
    #   checkMastheadVariants  every header image in use has its 960/1440px variants (T071), or phones get a blank header
    - name: Check the staged site (URLs, docs, tag redirects, masthead variants)
      run: ./gradlew checkSite -PsiteDir=build/site

    - name: Validate feed and sitemap XML
      run: |
        command -v xmllint >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; }
        xmllint --noout build/site/feed.xml build/site/sitemap.xml && echo "OK: feed.xml and sitemap.xml are well-formed"

    # Fails on any broken internal link or missing image/CSS/JS/font. Offline: external sites aren't checked
    # (that's T050). '^file://[^/]' skips protocol-relative embeds (//www.youtube.com/...), which offline mode
    # would otherwise treat as local files.
    - name: Check local links and assets
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        lycheeVersion: v0.24.2
        args: >-
          --offline --no-progress
          --root-dir ${{ github.workspace }}/build/site
          --exclude '^file://[^/]'
          'build/site/**/*.html'
        fail: true
        jobSummary: true

    # Reviews only the pages this PR changed, from the sources: Markdown links written wrong, brackets left in the
    # rendered text, links and images that point at nothing, the header, image sizes (T118; design in
    # docs/05-REVIEW-FLOW.md). The same check as `./gradlew reviewChanges` locally. Errors fail the job and show as
    # annotations on the PR's Files tab; the report is in the job summary. A push to main has no base to diff
    # against and the PR already ran it, so the step is skipped there.
    - name: Review changed pages
      if: github.event_name == 'pull_request'
      run: ./gradlew reviewChanges -Pbase="origin/$GITHUB_BASE_REF"

    # Package the staged site for GitHub Pages. include-hidden-files is required: the action drops files whose
    # names start with "." by default, and the site has published pages like that (tags/.NET.html, T067).
    # Without it the deployed site would silently differ from the checked build/site.
    - name: Upload the site for GitHub Pages
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: build/site
        include-hidden-files: true

  # Only a push (or manual run) on `main` deploys. Pull requests stop after the build job.
  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # verify the deployment came from this workflow
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never run two deploys at once, and never cancel one that has started
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Post-deploy smoke test (T092): fetches known URLs from the live site and fails the run if any isn't as
  # expected (pages and assets 200, a draft and docs/ 404). The gates above check build/site before upload;
  # this catches anything lost after it, like the hidden-file drop fixed in #47. Retries allow for the CDN.
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: scripts
    - name: Check the live site
      run: scripts/smoke-test.sh "${{ needs.deploy.outputs.page_url }}"
