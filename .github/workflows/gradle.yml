# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "source" ]
  pull_request:
    branches: [ "source" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # Write access is used only by the publish step, which runs only on a push to source.
    # Same-repo PRs come from people who can already push; fork PRs always get a read-only token.
    permissions:
      contents: write   # push the built site to master

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GiHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    - name: Bake with Gradle
      run: ./gradlew bake --info --stacktrace

    # docs/ holds internal planning docs and must never reach the live site (see AGENTS.md)
    - name: Check docs are not published
      run: scripts/check-docs-not-published.sh build/jbake

    # Every header image in use needs its 960/1440px variants (T071), or phones get a blank header
    - name: Check masthead variants
      run: python3 scripts/masthead-variants.py --check

    # Quality gates (T031). On Linux check-urls.sh is strict (case-sensitive), so it catches what macOS bakes can't.
    - name: Check published URLs still exist
      run: scripts/check-urls.sh build/jbake

    - name: Validate feed and sitemap XML
      run: |
        command -v xmllint >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; }
        xmllint --noout build/jbake/feed.xml build/jbake/sitemap.xml && echo "OK: feed.xml and sitemap.xml are well-formed"

    # Fails on any broken internal link or missing image/CSS/JS/font. Offline: external sites aren't checked
    # (that's T050). '^file://[^/]' skips protocol-relative embeds (//www.youtube.com/...), which offline mode
    # would otherwise treat as local files.
    - name: Check local links and assets
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        lycheeVersion: v0.24.2
        args: >-
          --offline --no-progress
          --root-dir ${{ github.workspace }}/build/jbake
          --exclude '^file://[^/]'
          'build/jbake/**/*.html'
        fail: true
        jobSummary: true

    # Drafts render in build/jbake for local preview; the publish contents must exclude them.
    # gitPublishCopy assembles exactly what would be pushed to master, without committing or pushing.
    - name: Check drafts are not published
      run: |
        ./gradlew gitPublishCopy
        drafts="$(find build/gitPublish -name '*-draft.html')"
        if [ -n "$drafts" ]; then
          echo "FAIL: drafts in the publish contents:"; echo "$drafts"; exit 1
        fi
        echo "OK: no drafts in the publish contents"

    # Pull requests build and run the checks above, but only a push to source publishes.
    # The push to master starts the GitHub Pages build by itself.
    - name: Publish content
      if: github.event_name == 'push' && github.ref == 'refs/heads/source'
      env:
        # The built-in token: created fresh for each run, scoped to this repo, nothing to expire
        GRGIT_USER: x-access-token
        GRGIT_PASS: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Author the publish commit as the Actions bot (git-publish uses JGit, which reads ~/.gitconfig)
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        ./gradlew gitPublishPush --info --stacktrace
