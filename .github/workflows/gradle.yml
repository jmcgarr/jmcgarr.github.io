# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "source" ]
  pull_request:
    branches: [ "source" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # Write access is used only by the publish steps, which run only on a push to source.
    # Same-repo PRs come from people who can already push; fork PRs always get a read-only token.
    permissions:
      contents: write   # push the built site to master
      pages: write      # request a GitHub Pages build

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GiHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    - name: Bake with Gradle
      run: ./gradlew bake --info --stacktrace

    # docs/ holds internal planning docs and must never reach the live site (see AGENTS.md)
    - name: Check docs are not published
      run: scripts/check-docs-not-published.sh build/jbake

    # Pull requests build and run the checks above, but only a push to source publishes
    - name: Publish content
      if: github.event_name == 'push' && github.ref == 'refs/heads/source'
      env:
        # The built-in token: created fresh for each run, scoped to this repo, nothing to expire
        GRGIT_USER: x-access-token
        GRGIT_PASS: ${{ secrets.GITHUB_TOKEN }}
      run: ./gradlew gitPublishPush --info --stacktrace

    # Not every push made with GITHUB_TOKEN reliably starts a Pages build, so ask for one explicitly.
    # If the push already started a build, this just queues a rebuild of the same commit.
    - name: Request a GitHub Pages build
      if: github.event_name == 'push' && github.ref == 'refs/heads/source'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
