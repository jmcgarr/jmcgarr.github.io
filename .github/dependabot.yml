# Dependabot (revival task T030). Weekly PRs for outdated dependencies. Each PR runs the full CI
# (bake + quality gates) and never deploys, so you can merge with confidence or close to skip.
version: 2
updates:
  # Workflow actions, including ones pinned to a commit SHA (Dependabot updates the SHA and its
  # version comment together)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(actions)"

  # Gradle dependencies (JBake and its engines, T096) and the wrapper. Major upgrades of JBake/Gradle are
  # planned work (see docs/01-PLATFORM-DECISION.md), so only minor/patch updates come here.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # logback 1.3+ needs SLF4J 2, and JBake 2.7 uses SLF4J 1.7, so 1.2.x is the newest that works (T112).
      # Without this, the weekly group would propose 1.5.x as a "minor" update and break the bake.
      - dependency-name: "ch.qos.logback:*"
        versions: [">= 1.3.0"]
    groups:
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: "chore(gradle)"
