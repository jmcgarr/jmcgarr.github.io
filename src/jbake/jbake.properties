site.host=https://www.mikemcgarr.com
render.tags=true
# Tag page URLs without spaces (T039): JBake replaces each space in a tag with a hyphen, so "acceptance test" is
# published as tags/acceptance-test.html. Nothing else changes (capitals, ".NET", and "boyd's" stay as written).
# The old URLs with spaces are kept as redirect stubs in assets/tags/ (scripts/tag-redirects.py).
tag.sanitize=true
render.sitemap=true
db.store=memory
# JBake 2.7 needs a plain name here (it rejects "build/cache"). With db.store=memory nothing is written to disk.
db.path=cache
# Modern Markdown (T094). JBake's default is HARDWRAPS,AUTOLINKS,FENCED_CODE_BLOCKS,DEFINITIONS, which turns
# every line break inside a paragraph into <br> and leaves tables, task lists, strikethrough, and footnotes as
# literal text. HARDWRAPS is left out on purpose. SMARTYPANTS (curly quotes, dashes, ellipses) is left out by
# the owner's choice; adding it would also change the typography of the existing Markdown post.
markdown.extensions=AUTOLINKS,FENCED_CODE_BLOCKS,DEFINITIONS,TABLES,STRIKETHROUGH,TASKLISTITEMS,FOOTNOTES
# Local preview only (`./gradlew preview`, T062): where `jbake -s` serves the site. A normal bake ignores these.
server.hostname=localhost
server.port=8080
