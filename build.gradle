plugins {
    id 'base'   // provides `clean`
    // The site's build logic as a plugin (docs/06-GRADLE-PLUGIN.md, M10): the included build in build-logic/, written
    // in Java with its own tests. It defines `bake`, `bakePreview`, `compileSass` and `checkNoHandEditedCss`, and the
    // `jbake` configuration the versions below are declared on. Configured by the jbakeSite { } block.
    id 'jbake-site'
}

// What the site is; how it is built is the plugin's.
jbakeSite {
    // JBake's source and the baked site (what CI deploys, minus drafts). Both are the defaults, written out so the
    // paths the README names are here.
    source = file('src/jbake')                     // default
    destination = layout.buildDirectory.dir('jbake')   // default
    // Redirect stubs whose names differ from a real page only by letter case, tags/DevOps.html → tags/devops.html
    // (T055, made by scripts/TagRedirects.java). They can't be JBake assets: on a case-insensitive filesystem (macOS)
    // both names are one file, and JBake copies assets after rendering, so the stub would replace the real page.
    // The plugin's bake adds them only when build/jbake is case-sensitive, as on Linux, where CI builds and GitHub
    // Pages serves.
    caseRedirects = file('src/case-redirects')     // default
    // The site's CSS (T043, issue #7; T134, T135). src/scss is the source of truth: the plugin's compileSass turns
    // every entry there (a .scss file whose name doesn't start with "_": clean-blog.scss, code.scss) into
    // build/generated/sass/css/<name>.css with Dart Sass, and the bake and the preview copy those into build/jbake,
    // so each is published at the same URL as before: /css/clean-blog.css, /css/code.css (the font rules are part
    // of clean-blog.css since T135; /css/fonts.css is a removed URL, listed in docs/baseline/expected-removals.txt).
    // The CSS is not committed, so it can't drift from the SCSS. Partials (_*.scss) are only compiled through the
    // entries. A Sass error fails the build, and CI. While `./gradlew bakePreview` runs, a saved SCSS change is
    // recompiled straight into build/jbake/css by the plugin's watcher.
    scss {
        source = file('src/scss')   // default
        publishedDir = 'css'        // default: an entry <name>.scss is published at /css/<name>.css
        // The CSS used to be hand-edited in src/jbake/assets/css/. The plugin's checkNoHandEditedCss stops a copy
        // from coming back there, where JBake would publish it and it would silently go stale (the bake replaces it
        // with the compiled one). Guarded: the compiled name of every entry, and these retired files: the old
        // minified theme CSS, and the two stylesheets folded into clean-blog.scss's partials, extra.css (T134) and
        // fonts.css (T135); their URLs are on docs/baseline/expected-removals.txt.
        retiredCss = ['clean-blog.min.css', 'extra.css', 'fonts.css']
        handEditedCssExplanation = "the site's CSS is generated from src/scss now (T043, T134, T135): " +
                '/css/clean-blog.css and /css/code.css are compiled from the entry of the same name, and extra.css ' +
                'and fonts.css are part of clean-blog.css.'
    }
    // JBake's classpath, the `jbake` configuration below: the plugin leaves out the template engines and parsers
    // this site doesn't use (Thymeleaf, Pebble, Jade4j, Groovy templates, AsciidoctorJ) and replaces OrientDB's
    // unmaintained lz4-java with its fork (T112; the why is in the plugin's JbakeClasspath). The defaults are right
    // for this site; a site that uses one of those engines sets `classpath { excludedGroups = [...] }` here.
}

// JBake runs directly (T096) instead of through the Gradle plugin `org.jbake.site`. That plugin is unmaintained
// (last release 5.5.0, 2021), can't run JBake 2.7, hid template errors behind a Groovy error (T095), and leaked
// memory in the Gradle daemon on every bake until the 4th one failed with "Java heap space" (T099). Running
// JBake's own launcher in a fresh JVM per bake fixes all of that (the plugin's JbakeTask, T125). Dependabot
// proposes jbake-core updates.
repositories {
    mavenCentral()
}

// The versions on JBake's classpath. The configuration itself, `jbake`, is the plugin's (JbakeClasspath).
dependencies {
    jbake 'org.jbake:jbake-core:2.7.0'
    // The engines and CLI parser this site uses, at newer versions than jbake-core asks for. jbake-core's Gradle
    // module metadata makes all its engines plain runtime dependencies (its Maven POM calls them optional), so
    // the ones the site doesn't use are left out by the plugin (jbakeSite.classpath, T112). Dependabot keeps these
    // current (minor/patch); check each update by comparing a bake against main.
    jbake 'org.freemarker:freemarker:2.3.35'                         // templates (*.ftl)
    jbake 'com.vladsch.flexmark:flexmark:0.64.8'                     // *.md
    jbake 'com.vladsch.flexmark:flexmark-profile-pegdown:0.64.8'     // markdown.extensions in jbake.properties
    jbake 'info.picocli:picocli:4.7.7'                               // JBake's command-line launcher
    // The preview (`jbake -b -s`, T062/T100) also needs JBake's web server and file watcher: JBake's server is
    // written against Jetty 9.4, and its watcher uses commons-vfs2. jbake-core brings both anyway (its launcher
    // loads Jetty even for a plain bake), but at older versions: Jetty 9.4.44 and commons-vfs2 2.9.0 (which pulls
    // in hadoop-hdfs-client, jackson-databind and okhttp). Naming them here raises both (T112) and keeps the
    // preview's needs explicit. One configuration serves the bake and the preview, so both run the same libraries
    // (T133: the preview's own configuration, which resolved identically, is gone). Jetty 9.4 is end of life.
    jbake 'org.eclipse.jetty:jetty-server:9.4.58.v20250814'          // serves build/jbake at localhost:8080
    jbake 'org.apache.commons:commons-vfs2:2.10.0'                   // watches src/jbake for changes

    // JBake 2.7.0 (its last release) pins old versions of these libraries, with known advisories. Raise them to
    // fixed versions (T112). A constraint only changes a version; it adds nothing that isn't already on the
    // classpath. Each was checked by comparing a bake against main (byte-identical) and against OSV.
    constraints {
        jbake 'org.apache.commons:commons-text:1.15.0'               // 1.8: CVE-2022-42889
        jbake 'org.apache.commons:commons-configuration2:2.15.1'     // 2.7: CVE-2022-33980 and others
        jbake 'org.apache.commons:commons-lang3:3.21.0'              // 3.12: CVE-2025-48924
        jbake 'commons-beanutils:commons-beanutils:1.11.0'           // 1.9.4: CVE-2025-48734
        jbake 'commons-io:commons-io:2.22.0'                         // 2.11: CVE-2024-47554
        jbake 'org.jsoup:jsoup:1.23.2'                               // 1.14.3: CVE-2022-36033 and others
        jbake 'org.yaml:snakeyaml:2.7'                               // 1.30: CVE-2022-1471 and others (*.yaml, data/)
        // Logback stays on 1.2: 1.3 and later need SLF4J 2, and JBake is built on SLF4J 1.7. 1.2.13 is the last
        // 1.2 release. Its remaining advisories have no 1.2 fix; they need a hostile logback config file (ours is
        // the plugin's jbake-logback.xml) or its network receivers, which JBake doesn't use. Dependabot is told to
        // skip 1.3 and later (.github/dependabot.yml).
        jbake 'ch.qos.logback:logback-classic:1.2.13'
        jbake 'ch.qos.logback:logback-core:1.2.13'
    }
}

// Starts a new draft post on its own post/<slug> branch (T060, issue #8). The logic is scripts/NewPost.java,
// a single-file Java program, so it can also run without Gradle: java scripts/NewPost.java --title="My Post".
//   ./gradlew newPost -Ptitle="My Post Title" [-Ptags="a, b"] [-Psummary="..."] [-Pslug=my-post]
//                     [-Pbranch=false] [-Ppr]
// -Ppr (T061) also commits the draft, pushes the branch, and opens a draft "[WIP] <title>" PR with gh.
// The draft is Markdown; the -Pformat=asciidoc option left with AsciiDoc (T102, 2026-10-18).
tasks.register('newPost', Exec) {
    group = 'writing'
    description = 'Starts a draft post on a new post/<slug> branch: ./gradlew newPost -Ptitle="My Post Title"'
    executable = "${System.getProperty('java.home')}/bin/java"
    // The providers are made here, while configuring, and only read when the task runs. The configuration cache
    // (T114) can't run code that reaches the build script (`providers`) at that point.
    // 'format' is passed on only so that a -Pformat=asciidoc from habit gets NewPost's clear refusal (T102).
    def options = ['title', 'tags', 'summary', 'slug', 'branch', 'pr', 'format']
            .collectEntries { [(it): providers.gradleProperty(it)] }
    argumentProviders.add({
        ['scripts/NewPost.java'] + options.findAll { name, value -> value.isPresent() }
                .collect { name, value -> "--${name}=${value.get()}".toString() }
    } as CommandLineArgumentProvider)
}

// Prepares an image added by hand under src/jbake/assets/img/ (sRGB, no camera metadata, the Rule 4 size and
// weight, a photo PNG turned into a JPEG that the pages are pointed at, the 960/1440 masthead variants). The
// logic is scripts/PrepareImage.java, a single-file Java program (T140), so it also runs without Gradle:
// java scripts/PrepareImage.java <image>, --variants <image> (the variants alone), --check-variants (what CI runs).
//   ./gradlew prepareImage -Pimage=src/jbake/assets/img/masthead/photo.png[,other.jpg] [-PdryRun] [-Ppng|-Pjpeg]
//                          [-Pwidth=1000] [-PkeepSource]
tasks.register('prepareImage', Exec) {
    group = 'writing'
    description = 'Prepares a hand-added image for the site (sRGB, metadata, size, masthead variants): ./gradlew prepareImage -Pimage=<path>'
    executable = "${System.getProperty('java.home')}/bin/java"
    def options = ['image', 'dryRun', 'png', 'jpeg', 'width', 'keepSource']
            .collectEntries { [(it): providers.gradleProperty(it)] }
    argumentProviders.add({
        if (!options.image.isPresent()) {
            throw new GradleException('Say which image: ./gradlew prepareImage -Pimage=src/jbake/assets/img/masthead/photo.png')
        }
        ['scripts/PrepareImage.java'] + options.findAll { name, value -> value.isPresent() }
                .collect { name, value -> "--${name}=${value.get()}".toString() }
    } as CommandLineArgumentProvider)
}

// Reviews the pages this branch changed (T117, docs/05-REVIEW-FLOW.md): Markdown link syntax, brackets left in the
// rendered text, local links and images, the header, image rules (errors), and a changed page's date, tag spellings,
// alt text, removed URLs and missing summaries (warnings). The logic is scripts/ReviewChanges.java, a single-file
// Java program, so it also runs without Gradle: java scripts/ReviewChanges.java (after a bake).
//   ./gradlew reviewChanges [-Pbase=main] [-Pall] [-Pstrict]
// -Pbase is the branch to diff against (default main); -Pall reviews every page; -Pstrict fails on warnings too.
tasks.register('reviewChanges', Exec) {
    group = 'writing'
    description = 'Reviews the pages this branch changed for broken Markdown, links and images: ./gradlew reviewChanges [-Pall]'
    dependsOn 'bake'
    executable = "${System.getProperty('java.home')}/bin/java"
    def options = ['base', 'all', 'strict', 'online'].collectEntries { [(it): providers.gradleProperty(it)] }
    argumentProviders.add({
        ['scripts/ReviewChanges.java'] + options.findAll { name, value -> value.isPresent() }
                .collect { name, value -> "--${name}=${value.get()}".toString() }
    } as CommandLineArgumentProvider)
    outputs.upToDateWhen { false }
    // The review's own exit code carries the result (1: errors, 2: couldn't run); say so instead of a stack trace.
    ignoreExitValue = true
    doLast {
        int code = executionResult.get().exitValue
        if (code == 1) {
            throw new GradleException('The review found errors (listed above). Fix them, or suppress one with ' +
                    '<!-- review: ignore E2, why --> on the line before it.')
        }
        if (code != 0) {
            throw new GradleException("The review couldn't run (exit $code, see above).")
        }
    }
}

// `./gradlew check` (the standard verification task) runs the review, so a bake plus the review is one command
// and the hand-edited-CSS guard (checkNoHandEditedCss, which bake runs first) comes with it.
tasks.named('check') {
    dependsOn 'reviewChanges'
}
