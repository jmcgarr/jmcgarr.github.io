plugins {
    id 'base'   // provides `clean`
}

// JBake runs directly (T096) instead of through the Gradle plugin `org.jbake.site`. That plugin is unmaintained
// (last release 5.5.0, 2021), can't run JBake 2.7, hid template errors behind a Groovy error (T095), and leaked
// memory in the Gradle daemon on every bake until the 4th one failed with "Java heap space" (T099). Running
// JBake's own launcher in a fresh JVM per bake fixes all of that. Dependabot proposes jbake-core updates.
repositories {
    mavenCentral()
}

configurations {
    jbake
}

dependencies {
    jbake 'org.jbake:jbake-core:2.7.0'
    // jbake-core marks its engines and CLI parser as optional, so add the ones this site uses, at the versions
    // jbake-core 2.7.0 was built and tested with.
    jbake 'org.freemarker:freemarker:2.3.31'                         // templates (*.ftl)
    jbake 'org.asciidoctor:asciidoctorj:2.5.7'                       // *.asciidoc
    jbake 'com.vladsch.flexmark:flexmark:0.62.2'                     // *.md
    jbake 'com.vladsch.flexmark:flexmark-profile-pegdown:0.62.2'     // markdown.extensions in jbake.properties
    jbake 'info.picocli:picocli:4.6.2'                               // JBake's command-line launcher
}

// Bakes src/jbake into build/jbake (drafts included, as <name>-draft.html; CI leaves them out of the deploy).
tasks.register('bake', JavaExec) {
    group = 'build'
    description = 'Bakes the site from src/jbake into build/jbake with JBake.'
    def source = file('src/jbake')
    def destination = layout.buildDirectory.dir('jbake').get().asFile
    // JRuby (inside AsciidoctorJ) extracts a native jffi library while baking. Keep it under build/tmp, which
    // `clean` removes, instead of the project root (T024).
    def jffiDir = layout.buildDirectory.dir('tmp/jffi').get().asFile
    inputs.dir(source)
    outputs.dir(destination)
    classpath = configurations.jbake
    mainClass = 'org.jbake.launcher.Main'
    args source.absolutePath, destination.absolutePath, '-b'
    // JRuby (AsciidoctorJ) asks for these to use native IO on modern JDKs; without them it prints a warning.
    jvmArgs '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED', '--add-opens', 'java.base/java.io=ALL-UNNAMED'
    systemProperty 'jffi.extract.dir', jffiDir.absolutePath
    systemProperty 'logback.configurationFile', file('gradle/jbake-logback.xml').absolutePath
    doFirst { jffiDir.mkdirs() }
}

// Local preview (T024): serves build/jbake with the JDK's built-in static server (jwebserver, JDK 18+) at
// http://localhost:8080, drafts included. As an Exec task, Ctrl+C stops the server cleanly.
tasks.register('preview', Exec) {
    group = 'documentation'
    description = 'Bakes the site and serves build/jbake at http://localhost:8080 (Ctrl+C to stop).'
    dependsOn 'bake'
    commandLine "${System.getProperty('java.home')}/bin/jwebserver",
            '--directory', file('build/jbake').absolutePath,
            '--port', '8080',
            '--bind-address', '127.0.0.1'
}

// Keep the familiar command: `./gradlew bakePreview` runs the preview task above.
tasks.register('bakePreview') {
    group = 'documentation'
    description = 'Same as preview: bakes the site and serves it at http://localhost:8080.'
    dependsOn 'preview'
}

// Based on a nice blog post from LD: http://ldaley.com/post/164424162157/auto-reload-html-asciidoctor-gradle-plugin-output
task liveEdit {
    if (System.getProperty("os.name").toLowerCase().contains("mac")) {
        doLast {
            ["osascript", "-e", """
                try
                    tell application "Finder" to get application file id "com.google.Chrome"
                    set appExists to true
                on error
                    set appExists to false
                end try
                if appExists then
                    tell application "Google Chrome"
                        set theUrl to "http://localhost:8080/"
                        set found to false
                        set theWindowIndex to 0
                        repeat with theWindow in every window
                            set theTabIndex to 0
                            repeat with theTab in every tab of theWindow
                                set theTabIndex to theTabIndex + 1
                                if theTab's URL starts with theUrl then
                                    set found to true
                                    tell application "Google Chrome" to set active tab index of theWindow to theTabIndex
                                    tell theTab to reload
                                end if
                            end repeat
                        end repeat
                        if not found then
                            set URL of (active tab of (make new window)) to theUrl
                        end if
                    end tell
                end if
            """].execute()
        }
    }
}
