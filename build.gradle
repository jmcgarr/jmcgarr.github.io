plugins {
    id 'base'   // provides `clean`
    // Compiles src/scss into the theme CSS (T043) with Dart Sass, the reference Sass compiler, through its Java
    // host (de.larsgrefer.sass:sass-embedded-host). No Node or Ruby: the host's jar bundles Dart Sass for macOS,
    // Linux, and Windows, unpacks the one for this machine into a temp folder, and talks to it over stdin/stdout.
    id 'io.freefair.sass-base' version '9.8.2'
}

// JBake runs directly (T096) instead of through the Gradle plugin `org.jbake.site`. That plugin is unmaintained
// (last release 5.5.0, 2021), can't run JBake 2.7, hid template errors behind a Groovy error (T095), and leaked
// memory in the Gradle daemon on every bake until the 4th one failed with "Java heap space" (T099). Running
// JBake's own launcher in a fresh JVM per bake fixes all of that. Dependabot proposes jbake-core updates.
repositories {
    mavenCentral()
}

configurations {
    jbake {
        // jbake-core 2.7.0 brings every template engine and content parser JBake supports. This site only uses
        // FreeMarker (*.ftl) and Markdown (*.md, flexmark), so leave out the others and their libraries, some of
        // which have advisories (T112). JBake only loads an engine whose classes are on the classpath, and skips
        // the rest. Groovy is used by nothing else.
        exclude group: 'org.thymeleaf'           // Thymeleaf (*.thyme), with ognl, javassist, attoparser
        exclude group: 'io.pebbletemplates'      // Pebble (*.peb)
        exclude group: 'de.neuland-bfi'          // Jade4j (*.jade), with commons-jexl
        exclude group: 'org.codehaus.groovy'     // Groovy templates (*.gsp, *.tpl): groovy, -templates, -xml, -dateutil
        // AsciiDoc (*.asciidoc, *.adoc) left with T102 (2026-10-18): every post and page is Markdown. AsciidoctorJ
        // brought JRuby, its native jffi/jnr libraries, ASM, jcodings and joni, all of them gone with it.
        exclude group: 'org.asciidoctor'         // AsciidoctorJ, with JRuby and its 20-odd libraries
    }
    // The preview also needs JBake's web server (Jetty) and file watcher (commons-vfs2) (T062, T100). jbake-core
    // brings both anyway, because JBake's launcher needs Jetty even for a plain bake (T112).
    jbakePreview { extendsFrom jbake }
}

// OrientDB (JBake's content store) depends on org.lz4:lz4-java, which is no longer maintained and has advisories.
// Use its maintained fork, at.yawk.lz4 (T112): same net.jpountz classes, so it's a drop-in replacement.
// Resolution strategies aren't inherited, so set it on the preview's configuration too.
configurations.matching { it.name in ['jbake', 'jbakePreview'] }.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('org.lz4:lz4-java') using module('at.yawk.lz4:lz4-java:1.12.0') because 'unmaintained (T112)'
    }
}

dependencies {
    jbake 'org.jbake:jbake-core:2.7.0'
    // The engines and CLI parser this site uses, at newer versions than jbake-core asks for. jbake-core's Gradle
    // module metadata makes all its engines plain runtime dependencies (its Maven POM calls them optional), so
    // the ones the site doesn't use are excluded above (T112). Dependabot keeps these current (minor/patch);
    // check each update by comparing a bake against main.
    jbake 'org.freemarker:freemarker:2.3.35'                         // templates (*.ftl)
    jbake 'com.vladsch.flexmark:flexmark:0.64.8'                     // *.md
    jbake 'com.vladsch.flexmark:flexmark-profile-pegdown:0.64.8'     // markdown.extensions in jbake.properties
    jbake 'info.picocli:picocli:4.7.7'                               // JBake's command-line launcher
    // Preview only (`jbake -b -s`, T062/T100). JBake's server is written against Jetty 9.4; its watcher uses VFS.
    // jbake-core already brings both, at the versions the constraints below pin; they're named here so the
    // preview's needs stay explicit.
    jbakePreview 'org.eclipse.jetty:jetty-server:9.4.58.v20250814'   // serves build/jbake at localhost:8080
    jbakePreview 'org.apache.commons:commons-vfs2:2.10.0'            // watches src/jbake for changes

    // JBake 2.7.0 (its last release) pins old versions of these libraries, with known advisories. Raise them to
    // fixed versions (T112). A constraint only changes a version; it adds nothing that isn't already on the
    // classpath. Each was checked by comparing a bake against main (byte-identical) and against OSV.
    constraints {
        jbake 'org.apache.commons:commons-text:1.15.0'               // 1.8: CVE-2022-42889
        jbake 'org.apache.commons:commons-configuration2:2.15.1'     // 2.7: CVE-2022-33980 and others
        jbake 'org.apache.commons:commons-lang3:3.21.0'              // 3.12: CVE-2025-48924
        jbake 'commons-beanutils:commons-beanutils:1.11.0'           // 1.9.4: CVE-2025-48734
        jbake 'commons-io:commons-io:2.22.0'                         // 2.11: CVE-2024-47554
        jbake 'org.jsoup:jsoup:1.23.2'                               // 1.14.3: CVE-2022-36033 and others
        jbake 'org.yaml:snakeyaml:2.7'                               // 1.30: CVE-2022-1471 and others (*.yaml, data/)
        // Logback stays on 1.2: 1.3 and later need SLF4J 2, and JBake is built on SLF4J 1.7. 1.2.13 is the last
        // 1.2 release. Its remaining advisories have no 1.2 fix; they need a hostile logback config file (ours is
        // gradle/jbake-logback.xml) or its network receivers, which JBake doesn't use. Dependabot is told to skip
        // 1.3 and later (.github/dependabot.yml).
        jbake 'ch.qos.logback:logback-classic:1.2.13'
        jbake 'ch.qos.logback:logback-core:1.2.13'
        // The bake used jbake-core's Jetty 9.4.44 and commons-vfs2 2.9.0 (which pulls in hadoop-hdfs-client,
        // jackson-databind and okhttp); use the preview's versions instead, so both run the same libraries.
        // Jetty can't be left out: JBake's launcher loads it even for a plain bake. Jetty 9.4 is end of life.
        jbake 'org.eclipse.jetty:jetty-server:9.4.58.v20250814'
        jbake 'org.apache.commons:commons-vfs2:2.10.0'
    }
}

// The bake and the preview both run JBake's own launcher in a fresh JVM (T096), with these settings.
def jbakeSource = file('src/jbake')
def jbakeDestination = layout.buildDirectory.dir('jbake').get().asFile
// jffi (jnr-ffi, which OrientDB's jnr-posix brings; JRuby used to bring it too, until T102 removed AsciidoctorJ)
// extracts its native library to a temporary file while loading (and removes it afterwards). Keep that under
// build/tmp, which `clean` removes, instead of the project root (T024).
def jffiDir = layout.buildDirectory.dir('tmp/jffi').get().asFile

// Newer JDKs (T113): from JDK 24, JBake's JVM prints two warnings that the bake on 21 doesn't. OrientDB's
// concurrentlinkedhashmap calls sun.misc.Unsafe::objectFieldOffset ("will be removed in a future release"), and
// jffi (loaded by OrientDB's jnr-posix) calls System::load ("Restricted methods will be blocked in a future
// release"). These flags allow both and silence the warnings; a bake without either still warns (checked on
// JDK 25 after T102 removed JRuby). Each is added only on a JDK that knows it: JDK 21 refuses to start with
// --sun-misc-unsafe-memory-access ("Unrecognized option"), which arrived in JDK 23 (JEP 471).
// --enable-native-access is final from JDK 22 (JEP 454); 21 accepts it, but leaving it off keeps 21's command
// line as it was. The version is that of the Java that runs JBake: the task's javaLauncher, which is the JVM
// running Gradle (JAVA_HOME) because no toolchain is set. It is read lazily, and it's a task input.
abstract class NewJdkJvmArgs implements CommandLineArgumentProvider {
    @Input
    abstract Property<Integer> getJavaVersion()

    @Override
    Iterable<String> asArguments() {
        def version = javaVersion.get()
        def args = []
        if (version >= 22) { args << '--enable-native-access=ALL-UNNAMED' }
        if (version >= 23) { args << '--sun-misc-unsafe-memory-access=allow' }
        return args
    }
}

def configureJBake = { JavaExec task ->
    task.mainClass = 'org.jbake.launcher.Main'
    // JDK 22+ and 23+ only (T113, see NewJdkJvmArgs above). The two --add-opens flags JRuby wanted went with
    // AsciidoctorJ (T102): without them the bake prints nothing extra on JDK 21 or 25.
    task.jvmArgumentProviders.add(objects.newInstance(NewJdkJvmArgs).tap {
        javaVersion = task.javaLauncher.map { it.metadata.languageVersion.asInt() }
    })
    task.systemProperty 'jffi.extract.dir', jffiDir.absolutePath
    task.systemProperty 'logback.configurationFile', file('gradle/jbake-logback.xml').absolutePath
    task.doFirst { jffiDir.mkdirs() }
}

// Redirect stubs whose names differ from a real page only by letter case, such as tags/DevOps.html → tags/devops.html
// (T055, made by scripts/tag-redirects.py). They can't be JBake assets: on a case-insensitive filesystem (macOS)
// both names are one file, and JBake copies assets after rendering, so the stub would replace the real page. The
// bake adds them only when build/jbake is case-sensitive, as on Linux, where CI builds and GitHub Pages serves.
def caseRedirects = file('src/case-redirects')

// Copies every file under one folder into another, keeping relative paths and replacing existing files.
def copyTree = { File from, File to ->
    def source = from.toPath()
    def destination = to.toPath()
    java.nio.file.Files.walk(source).withCloseable { paths ->
        paths.filter { java.nio.file.Files.isRegularFile(it) }.each { file ->
            def target = destination.resolve(source.relativize(file).toString())
            java.nio.file.Files.createDirectories(target.parent)
            java.nio.file.Files.copy(file, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

// The theme CSS (T043, issue #7). src/scss is the source of truth: compileSass turns src/scss/clean-blog.scss
// into build/generated/sass/css/clean-blog.css, and the bake and the preview copy that into build/jbake, so it is
// published at the same URL as before, /css/clean-blog.css. The CSS is not committed, so it can't drift from the
// SCSS. Partials (_*.scss) are only compiled through clean-blog.scss. A Sass error fails the build, and CI.
def sassSource = file('src/scss')
def sassOutput = layout.buildDirectory.dir('generated/sass').get().asFile
def sassEntry = new File(sassSource, 'clean-blog.scss')
def sassCssPath = 'css/clean-blog.css'   // the published path, inside build/jbake and inside sassOutput
tasks.register('compileSass', io.freefair.gradle.plugins.sass.SassCompile) {
    group = 'build'
    description = 'Compiles src/scss into the theme CSS (build/generated/sass/css/clean-blog.css) with Dart Sass.'
    source = sassSource
    destinationDir = new File(sassOutput, 'css')
    outputStyle = 'EXPANDED'      // readable, like the CSS the site served before T043
    sourceMapEnabled = false      // no .map file and no sourceMappingURL comment in the published CSS
}

// The CSS used to be hand-edited in src/jbake/assets/css/. Stop a copy from coming back there: JBake would
// publish it and it would silently go stale (the bake replaces it with the compiled one).
def generatedCssSources = ['clean-blog.css', 'clean-blog.min.css'].collect { new File(jbakeSource, "assets/css/$it") }
def checkNoHandEditedCss = {
    def found = generatedCssSources.findAll { it.exists() }
    if (found) {
        throw new GradleException("${found*.path.join(', ')}: the theme CSS is generated from src/scss now (T043). " +
                'Move any change into the SCSS, then delete this file.')
    }
}

// Bakes src/jbake into build/jbake (drafts included, as <name>-draft.html; CI leaves them out of the deploy).
tasks.register('bake', JavaExec) {
    group = 'build'
    description = 'Bakes the site from src/jbake into build/jbake with JBake.'
    configureJBake(it)
    inputs.dir(jbakeSource)
    inputs.dir(caseRedirects)
    inputs.files(tasks.named('compileSass')).withPropertyName('themeCss')
    outputs.dir(jbakeDestination)
    classpath = configurations.jbake
    args jbakeSource.absolutePath, jbakeDestination.absolutePath, '-b'
    doFirst { checkNoHandEditedCss() }
    doLast {
        // After JBake, so nothing JBake copies can replace it
        copyTree(sassOutput, jbakeDestination)
        if (java.nio.file.Files.exists(jbakeDestination.toPath().resolve('INDEX.HTML'))) {
            logger.lifecycle('Case-insensitive filesystem: left out the redirect stubs in src/case-redirects ' +
                    '(they would replace the real pages with the same name in another case). CI adds them.')
            return
        }
        copyTree(caseRedirects, jbakeDestination)
    }
}

// Preview only (T043): recompiles the theme CSS straight into build/jbake while the preview runs, whenever a
// file in src/scss changes (it checks every 0.5 s). JBake's own watcher only covers src/jbake. The page's live
// reload notices the new CSS and reloads. A Sass error is printed and the last good CSS stays. Gradle closes
// this service, and the Dart Sass process with it, when the preview stops.
abstract class SassPreviewWatcher implements BuildService<Params>, AutoCloseable {
    interface Params extends BuildServiceParameters {
        DirectoryProperty getSourceDir()
        RegularFileProperty getEntry()
        RegularFileProperty getTarget()
    }

    // Not private: Gradle runs a generated subclass, and Groovy closures there can't see private fields.
    protected static final org.gradle.api.logging.Logger LOG = org.gradle.api.logging.Logging.getLogger('sass')
    protected volatile Thread thread
    protected volatile boolean stopping

    void start() {
        def sourceDir = parameters.sourceDir.get().asFile.toPath()
        def entry = parameters.entry.get().asFile
        def target = parameters.target.get().asFile.toPath()
        thread = Thread.startDaemon('scss-preview-watcher') {
            def compiler = null
            try {
                def stamp = { java.nio.file.Files.walk(sourceDir).withCloseable { paths ->
                    paths.filter { java.nio.file.Files.isRegularFile(it) }.sorted().collect {
                        "$it ${java.nio.file.Files.getLastModifiedTime(it).toMillis()} ${java.nio.file.Files.size(it)}"
                    }.join('\n')
                } }
                def seen = stamp()
                LOG.lifecycle('Watching src/scss: a saved change recompiles /css/clean-blog.css.')
                while (!stopping) {
                    Thread.sleep(500)
                    def now = stamp()
                    if (now == seen) { continue }
                    seen = now
                    try {
                        if (compiler == null) {
                            compiler = de.larsgrefer.sass.embedded.SassCompilerFactory.bundled()
                            compiler.outputStyle = com.sass_lang.embedded_protocol.OutputStyle.EXPANDED
                            compiler.generateSourceMaps = false
                        }
                        def css = compiler.compileFile(entry).css
                        def temp = java.nio.file.Files.createTempFile(target.parent, 'clean-blog', '.tmp')
                        java.nio.file.Files.writeString(temp, css)
                        java.nio.file.Files.move(temp, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                                java.nio.file.StandardCopyOption.ATOMIC_MOVE)
                        LOG.lifecycle('src/scss changed: recompiled /css/clean-blog.css')
                    } catch (de.larsgrefer.sass.embedded.SassCompilationFailedException e) {
                        LOG.error("src/scss changed, but Sass failed (the preview keeps the last good CSS):\n" +
                                e.compileFailure.formatted)
                    }
                }
            } catch (InterruptedException ignored) {
                // the preview stopped
            } catch (Exception e) {
                LOG.error("The src/scss watcher stopped: $e")
            } finally {
                compiler?.close()
            }
        }
    }

    @Override
    void close() {
        stopping = true
        thread?.interrupt()
        thread?.join(5000)
    }
}
def sassPreviewWatcher = gradle.sharedServices.registerIfAbsent('sassPreviewWatcher', SassPreviewWatcher) {
    parameters.sourceDir = sassSource
    parameters.entry = sassEntry
    parameters.target = new File(jbakeDestination, sassCssPath)
}

// Local preview (T062, T100): `jbake -b -s` bakes into build/jbake, serves it with Jetty at http://localhost:8080
// (127.0.0.1 only; server.* in jbake.properties), drafts included, and watches content, templates, and assets:
// a save is live in about 1 s (it polls every second, then rebakes everything, or copies a changed asset). In this
// mode JBake sets site.host to http://localhost:8080/, so feed, sitemap, and share links stay local. Unlike the
// JDK's jwebserver (used before), Jetty serves dot-file paths such as /tags/.NET.html. One JVM serves the whole
// session; Ctrl+C stops it. Restart after changing jbake.properties, or after deleting or renaming a source file
// (its old page stays in build/jbake until `clean`). The next `./gradlew bake` notices the changed output and
// rebakes with the real site.host, without the live-reload script.
//
// If the port is taken (say, by a preview in another terminal or clone), JBake only says "unable to start the
// server" and exits with 4 (T101). So check first: bind the address JBake will use, the same way its Jetty does,
// and fail with a clear message if that doesn't work. The address comes from server.hostname and server.port in
// jbake.properties, where JBake reads it (JBake's own defaults are localhost and 8820).
def jbakeProperties = new File(jbakeSource, 'jbake.properties')
def checkPreviewPortFree = {
    def config = new Properties()
    jbakeProperties.withReader('UTF-8') { config.load(it) }
    def host = config.getProperty('server.hostname', 'localhost').trim()
    def port = config.getProperty('server.port', '8820').trim() as int
    try {
        new ServerSocket().withCloseable { socket ->
            socket.reuseAddress = true   // as Jetty does, so a just-stopped preview doesn't count as "in use"
            socket.bind(new InetSocketAddress(host, port))
        }
    } catch (BindException ignored) {
        throw new GradleException("Port $port is already in use (is another bakePreview running?). " +
                'Stop it, or set server.port in src/jbake/jbake.properties.')
    }
}
tasks.register('preview', JavaExec) {
    group = 'documentation'
    description = 'Bakes, serves http://localhost:8080, rebuilds on save, and reloads the open page (Ctrl+C to stop).'
    configureJBake(it)
    classpath = configurations.jbakePreview
    args jbakeSource.absolutePath, jbakeDestination.absolutePath, '-b', '-s'
    // The theme CSS (T043): compiled first and put in place before JBake starts (JBake never deletes it), then
    // kept up to date by the SCSS watcher above.
    dependsOn 'compileSass'
    usesService(sassPreviewWatcher)
    doFirst {
        checkPreviewPortFree()
        checkNoHandEditedCss()
        copyTree(sassOutput, jbakeDestination)
        sassPreviewWatcher.get().start()
    }
    // Live reload (T064): templates see this as config.preview_livereload, and header.ftl then adds a small
    // script (templates/preview-reload.ftl) that reloads the page after each rebuild. Only this task sets it,
    // so `bake` never outputs the script, and CI fails if it ever reaches the deploy contents.
    systemProperty 'preview.livereload', 'true'
}

// Keep the familiar command: `./gradlew bakePreview` runs the preview task above.
tasks.register('bakePreview') {
    group = 'documentation'
    description = 'Same as preview: bakes, serves http://localhost:8080, rebuilds on every save, and reloads the page.'
    dependsOn 'preview'
}

// Starts a new draft post on its own post/<slug> branch (T060, issue #8). The logic is scripts/NewPost.java,
// a single-file Java program, so it can also run without Gradle: java scripts/NewPost.java --title="My Post".
//   ./gradlew newPost -Ptitle="My Post Title" [-Ptags="a, b"] [-Psummary="..."] [-Pslug=my-post]
//                     [-Pbranch=false] [-Ppr]
// -Ppr (T061) also commits the draft, pushes the branch, and opens a draft "[WIP] <title>" PR with gh.
// The draft is Markdown; the -Pformat=asciidoc option left with AsciiDoc (T102, 2026-10-18).
tasks.register('newPost', Exec) {
    group = 'writing'
    description = 'Starts a draft post on a new post/<slug> branch: ./gradlew newPost -Ptitle="My Post Title"'
    executable = "${System.getProperty('java.home')}/bin/java"
    // The providers are made here, while configuring, and only read when the task runs. The configuration cache
    // (T114) can't run code that reaches the build script (`providers`) at that point.
    // 'format' is passed on only so that a -Pformat=asciidoc from habit gets NewPost's clear refusal (T102).
    def options = ['title', 'tags', 'summary', 'slug', 'branch', 'pr', 'format']
            .collectEntries { [(it): providers.gradleProperty(it)] }
    argumentProviders.add({
        ['scripts/NewPost.java'] + options.findAll { name, value -> value.isPresent() }
                .collect { name, value -> "--${name}=${value.get()}".toString() }
    } as CommandLineArgumentProvider)
}
