plugins {
    id 'base'   // provides `clean`
}

// JBake runs directly (T096) instead of through the Gradle plugin `org.jbake.site`. That plugin is unmaintained
// (last release 5.5.0, 2021), can't run JBake 2.7, hid template errors behind a Groovy error (T095), and leaked
// memory in the Gradle daemon on every bake until the 4th one failed with "Java heap space" (T099). Running
// JBake's own launcher in a fresh JVM per bake fixes all of that. Dependabot proposes jbake-core updates.
repositories {
    mavenCentral()
}

configurations {
    jbake
    // The preview also needs JBake's optional web server and file watcher (T062, T100). They live in their own
    // configuration so the production bake's classpath stays exactly as it was.
    jbakePreview { extendsFrom jbake }
}

dependencies {
    jbake 'org.jbake:jbake-core:2.7.0'
    // jbake-core marks its engines and CLI parser as optional, so add the ones this site uses. Dependabot keeps
    // them current (minor/patch); check each update by comparing a bake against main.
    jbake 'org.freemarker:freemarker:2.3.35'                         // templates (*.ftl)
    jbake 'org.asciidoctor:asciidoctorj:2.5.13'                      // *.asciidoc
    jbake 'com.vladsch.flexmark:flexmark:0.64.8'                     // *.md
    jbake 'com.vladsch.flexmark:flexmark-profile-pegdown:0.64.8'     // markdown.extensions in jbake.properties
    jbake 'info.picocli:picocli:4.7.7'                               // JBake's command-line launcher
    // Preview only (`jbake -b -s`, T062/T100). JBake's server is written against Jetty 9.4; its watcher uses VFS.
    jbakePreview 'org.eclipse.jetty:jetty-server:9.4.58.v20250814'   // serves build/jbake at localhost:8080
    jbakePreview 'org.apache.commons:commons-vfs2:2.10.0'            // watches src/jbake for changes
}

// The bake and the preview both run JBake's own launcher in a fresh JVM (T096), with these settings.
def jbakeSource = file('src/jbake')
def jbakeDestination = layout.buildDirectory.dir('jbake').get().asFile
// JRuby (inside AsciidoctorJ) extracts a native jffi library while baking. Keep it under build/tmp, which `clean`
// removes, instead of the project root (T024).
def jffiDir = layout.buildDirectory.dir('tmp/jffi').get().asFile
def configureJBake = { JavaExec task ->
    task.mainClass = 'org.jbake.launcher.Main'
    // JRuby (AsciidoctorJ) asks for these to use native IO on modern JDKs; without them it prints a warning.
    task.jvmArgs '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED', '--add-opens', 'java.base/java.io=ALL-UNNAMED'
    task.systemProperty 'jffi.extract.dir', jffiDir.absolutePath
    task.systemProperty 'logback.configurationFile', file('gradle/jbake-logback.xml').absolutePath
    task.doFirst { jffiDir.mkdirs() }
}

// Redirect stubs whose names differ from a real page only by letter case, such as tags/DevOps.html → tags/devops.html
// (T055, made by scripts/tag-redirects.py). They can't be JBake assets: on a case-insensitive filesystem (macOS)
// both names are one file, and JBake copies assets after rendering, so the stub would replace the real page. The
// bake adds them only when build/jbake is case-sensitive, as on Linux, where CI builds and GitHub Pages serves.
def caseRedirects = file('src/case-redirects')

// Bakes src/jbake into build/jbake (drafts included, as <name>-draft.html; CI leaves them out of the deploy).
tasks.register('bake', JavaExec) {
    group = 'build'
    description = 'Bakes the site from src/jbake into build/jbake with JBake.'
    configureJBake(it)
    inputs.dir(jbakeSource)
    inputs.dir(caseRedirects)
    outputs.dir(jbakeDestination)
    classpath = configurations.jbake
    args jbakeSource.absolutePath, jbakeDestination.absolutePath, '-b'
    doLast {
        def destination = jbakeDestination.toPath()
        if (java.nio.file.Files.exists(destination.resolve('INDEX.HTML'))) {
            logger.lifecycle('Case-insensitive filesystem: left out the redirect stubs in src/case-redirects ' +
                    '(they would replace the real pages with the same name in another case). CI adds them.')
            return
        }
        def source = caseRedirects.toPath()
        java.nio.file.Files.walk(source).withCloseable { paths ->
            paths.filter { java.nio.file.Files.isRegularFile(it) }.each { file ->
                def target = destination.resolve(source.relativize(file).toString())
                java.nio.file.Files.createDirectories(target.parent)
                java.nio.file.Files.copy(file, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}

// Local preview (T062, T100): `jbake -b -s` bakes into build/jbake, serves it with Jetty at http://localhost:8080
// (127.0.0.1 only; server.* in jbake.properties), drafts included, and watches content, templates, and assets:
// a save is live in about 1 s (it polls every second, then rebakes everything, or copies a changed asset). In this
// mode JBake sets site.host to http://localhost:8080/, so feed, sitemap, and share links stay local. Unlike the
// JDK's jwebserver (used before), Jetty serves dot-file paths such as /tags/.NET.html. One JVM serves the whole
// session; Ctrl+C stops it. Restart after changing jbake.properties, or after deleting or renaming a source file
// (its old page stays in build/jbake until `clean`). The next `./gradlew bake` notices the changed output and
// rebakes with the real site.host, without the live-reload script.
tasks.register('preview', JavaExec) {
    group = 'documentation'
    description = 'Bakes, serves http://localhost:8080, rebuilds on save, and reloads the open page (Ctrl+C to stop).'
    configureJBake(it)
    classpath = configurations.jbakePreview
    args jbakeSource.absolutePath, jbakeDestination.absolutePath, '-b', '-s'
    // Live reload (T064): templates see this as config.preview_livereload, and header.ftl then adds a small
    // script (templates/preview-reload.ftl) that reloads the page after each rebuild. Only this task sets it,
    // so `bake` never outputs the script, and CI fails if it ever reaches the deploy contents.
    systemProperty 'preview.livereload', 'true'
}

// Keep the familiar command: `./gradlew bakePreview` runs the preview task above.
tasks.register('bakePreview') {
    group = 'documentation'
    description = 'Same as preview: bakes, serves http://localhost:8080, rebuilds on every save, and reloads the page.'
    dependsOn 'preview'
}

// Starts a new draft post on its own post/<slug> branch (T060, issue #8). The logic is scripts/NewPost.java,
// a single-file Java program, so it can also run without Gradle: java scripts/NewPost.java --title="My Post".
//   ./gradlew newPost -Ptitle="My Post Title" [-Ptags="a, b"] [-Psummary="..."] [-Pformat=md|asciidoc]
//                     [-Pslug=my-post] [-Pbranch=false] [-Ppr]
// -Ppr (T061) also commits the draft, pushes the branch, and opens a draft "[WIP] <title>" PR with gh.
tasks.register('newPost', Exec) {
    group = 'writing'
    description = 'Starts a draft post on a new post/<slug> branch: ./gradlew newPost -Ptitle="My Post Title"'
    executable = "${System.getProperty('java.home')}/bin/java"
    def options = ['title', 'tags', 'summary', 'format', 'slug', 'branch', 'pr']
    argumentProviders.add({
        ['scripts/NewPost.java'] + options.findAll { providers.gradleProperty(it).isPresent() }
                .collect { "--${it}=${providers.gradleProperty(it).get()}".toString() }
    } as CommandLineArgumentProvider)
}
